name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  backend-lint-and-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest pytest-asyncio

      - name: Lint with flake8
        run: |
          # Stop the build on syntax errors / undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Full lint as warning-only (doesn't fail build) for style issues
          flake8 . --count --exit-zero --max-line-length=120 --statistics

      - name: Run tests
        env:
          SUPABASE_URL: "http://localhost:54321"
          SUPABASE_SERVICE_ROLE_KEY: "test-key"
          HF_API_TOKEN: "test-token"
          GOOGLE_AI_API_KEY: "test-key"
          GOOGLE_FACTCHECK_API_KEY: "test-key"
          SEARCH_API_KEY: "test-key"
          UPSTASH_REDIS_URL: "test-url"
          UPSTASH_REDIS_TOKEN: "test-token"
          UPSTASH_REDIS_PROTOCOL_URL: ""
        run: |
          pytest -v --tb=short

  frontend-lint-and-build:
    name: Frontend — Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint

      - name: Build check
        run: npm run build
        env:
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_ANON_KEY: "placeholder-key"
          VITE_API_URL: "http://localhost:8000"
