services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: veritasai-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veritasai-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
